[package]
name = "jito-bundler-engine"
version = "0.1.0"
description = "High-performance Rust client for assembling and sending atomic bundles to Jito Block Engine"
edition = "2021"

[dependencies]
solana-client = "=1.18.17"
solana-sdk = "=1.18.17"
tokio = { version = "1.36", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5"
bincode = "1.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
